# Main navigation (top header). `identifier` is matched against a page's
# `nav` front-matter value (or a post's `category`) to highlight the current item.
main:
  - name: About
    identifier: about
    url: /
    weight: 10
  - name: Technical Blog
    identifier: technical
    url: /technical/
    weight: 20
  - name: Non-Technical
    identifier: non-technical
    url: /non-technical/
    weight: 30
  - name: Service
    identifier: service
    url: /service/
    weight: 40
