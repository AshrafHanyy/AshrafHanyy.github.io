# Hugo configuration for ashrafhanyy.github.io
# The site uses its own lightweight theme in `layouts/` and `assets/` (no Hugo modules).

title: Ashraf Hany
baseURL: 'https://ashrafhanyy.github.io/'
locale: en-US
defaultContentLanguage: en
removePathAccents: true

enableRobotsTXT: true
enableEmoji: true
summaryLength: 40

# Taxonomy pages are not used on this site.
disableKinds: [taxonomy, term]

outputs:
  home: [HTML, RSS]
  section: [HTML, RSS]

# Old URLs from the previous theme redirect to their new homes (see `aliases` in front matter).
disableAliases: false

services:
  disqus:
    shortname: 'https-ashrafhanyy-github-io-blog'
  rss:
    limit: 30

imaging:
  resampleFilter: lanczos
  anchor: center
  jpeg:
    quality: 82

markup:
  goldmark:
    renderer:
      # Posts embed raw HTML such as <video> tags.
      unsafe: true
    parser:
      wrapStandAloneImageWithinParagraph: false
  highlight:
    style: github
    noClasses: true
    lineNos: false
    tabWidth: 4

timeout: 600s

ignoreFiles: ['\.ipynb$', '\.ipynb_checkpoints$', '\.Rmd$', '\.Rmarkdown$', '_cache$', '\.HEIC$']
