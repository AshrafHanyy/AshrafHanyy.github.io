{{- /* Disqus thread keyed on the page URL (same URLs as the previous theme, so existing threads stay attached). */ -}}
{{- with site.Config.Services.Disqus.Shortname }}
<h2 class="comments-title">Comments</h2>
<div id="disqus_thread"></div>
<script>
  var disqus_config = function () { this.page.url = {{ $.Permalink }}; };
  (function () {
    if (["localhost", "127.0.0.1"].indexOf(window.location.hostname) !== -1) {
      document.getElementById("disqus_thread").innerHTML = '<p class="muted">Comments load on the live site.</p>';
      return;
    }
    var s = document.createElement("script");
    s.src = "https://{{ . }}.disqus.com/embed.js";
    s.setAttribute("data-timestamp", +new Date());
    (document.head || document.body).appendChild(s);
  })();
</script>
<noscript>Enable JavaScript to view the comments powered by Disqus.</noscript>
{{- end }}
