<!doctype html>
<html lang="en">
<head>
  {{- partial "head.html" . }}
</head>
<body class="{{ block "bodyclass" . }}page{{ end }}">
  <a class="skip-link" href="#main">Skip to content</a>
  {{- partial "header.html" . }}
  <main id="main">
    {{- block "main" . }}{{ end }}
  </main>
  {{- partial "footer.html" . }}
  {{- $js := resources.Get "js/main.js" | minify | fingerprint }}
  <script src="{{ $js.RelPermalink }}" defer></script>
</body>
</html>
